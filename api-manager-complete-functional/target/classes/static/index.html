<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Automation Tool 3.0</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-text">API Automation Tool 3.0</span>
                </div>
                <div class="workspace-controls">
                    <select id="workspace-selector" class="workspace-select">
                        <option value="1">Fraud Detection API (12 tests)</option>
                        <option value="2">Payment Gateway (8 tests)</option>
                        <option value="3">User Management (5 tests)</option>
                    </select>
                    <button id="new-workspace-btn" class="icon-btn" title="New workspace">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="nav-right">
                <button id="quick-test-btn" class="icon-btn" title="Quick Test - Ad-hoc requests">
                    <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Left Sidebar -->
            <aside class="sidebar">
                <!-- Swagger Files Section -->
                <div class="sidebar-section">
                    <div class="section-header">
                        <h3>Swagger Specifications</h3>
                        <button id="add-swagger-btn" class="icon-btn-sm">
                            <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="swagger-list" class="swagger-list"></div>
                </div>

                <!-- Endpoints Section -->
                <div class="sidebar-section endpoints-section">
                    <div class="section-header">
                        <h3>Endpoints</h3>
                        <span id="endpoint-count" class="count-badge">0</span>
                    </div>
                    <div class="endpoint-filters">
                        <input type="text" id="endpoint-search" class="endpoint-search-input" placeholder="Search path or description…" oninput="app.filterEndpoints()">
                        <select id="endpoint-method-filter" class="endpoint-method-select" onchange="app.filterEndpoints()">
                            <option value="">All Methods</option>
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="PATCH">PATCH</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                    </div>
                    <div id="endpoints-list" class="endpoints-list"></div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="content">
                <!-- Tabs -->
                <div id="view-tabs" class="tabs">
                    <div class="tab" data-view="request" id="tab-request">
                        <span>🚀</span>
                        <span>Request</span>
                    </div>
                    <div class="tab active" data-view="testcases" id="tab-testcases">
                        <span>✓</span>
                        <span>Test Cases</span>
                    </div>
                    <div class="tab" data-view="mockserver" id="tab-mockserver">
                        <span>🔧</span>
                        <span>Mock Server</span>
                    </div>
                    <div class="tab" data-view="loadtest" id="tab-loadtest">
                        <span>⚡</span>
                        <span>Load Test</span>
                    </div>
                    <div class="tab" data-view="documentation" id="tab-documentation">
                        <span>📚</span>
                        <span>Docs</span>
                    </div>
                    <div class="tab" data-view="environments" id="tab-environments">
                        <span>🌍</span>
                        <span>Environments</span>
                    </div>
                    <div class="tab" data-view="reports" id="tab-reports">
                        <span>📊</span>
                        <span>Reports</span>
                    </div>
                    <div class="tab" data-view="certificates" id="tab-certificates">
                        <span>🔐</span>
                        <span>Certificates</span>
                    </div>
                </div>
                
                <!-- Main Content Area -->
                <div id="main-content"></div>
            </main>

            <!-- Right Sidebar (Secrets - Hidden by default) -->
            <aside id="secrets-sidebar" class="secrets-sidebar hidden">
                <div class="secrets-header">
                    <h3>Secrets Vault</h3>
                    <button id="add-secret-btn" class="btn-text">+ Add</button>
                </div>
                <div id="secrets-list"></div>
            </aside>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/api-client.js"></script>
    <script src="/js/report-generator.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
