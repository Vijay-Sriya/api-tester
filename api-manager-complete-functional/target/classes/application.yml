server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: api-manager-pro
  
  datasource:
    url: jdbc:sqlite:${user.home}/.api-manager/database.db
    driver-class-name: org.sqlite.JDBC
    
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application Configuration
app:
  name: API Manager Pro
  version: 1.0.0
  database-path: ${user.home}/.api-manager
  
  secrets:
    master-key: 123sghkffgpsdgvx
    algorithm: AES
    
  mock-server:
    default-port: 8765
    max-port: 8800
    
  load-test:
    max-virtual-users: 1000
    max-duration-seconds: 3600

# Logging
logging:
  level:
    root: INFO
    com.vijay.apimanager: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: ${user.home}/.api-manager/logs/application.log
    max-size: 10MB
    max-history: 7

# CORS Configuration
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600
